<style>
:root {
  --inchiostro: #1c2733;
  --grigio: #5b6878;
  --carta: #ffffff;
  --fondo: #f1f4f8;
  --linea: #d6dde6;
  --blu: #1e3a5f;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color: var(--inchiostro);
  background: var(--fondo);
  display: flex;
  flex-direction: column;
}
.barra {
  background: var(--carta);
  border-bottom: 1px solid var(--linea);
  padding: calc(8px + env(safe-area-inset-top, 0px)) 16px 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.barra h1 { margin: 0; font-size: 15px; color: var(--blu); letter-spacing: .01em; text-wrap: balance; }
.barra h1 small { display: block; margin-top: 1px; font-size: 12px; font-weight: 400; color: var(--grigio); }
.numeri { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.numeri div { background: var(--fondo); border-radius: 8px; padding: 4px 4px 5px; text-align: center; }
.numeri b { display: block; font-size: 18px; color: var(--blu); font-variant-numeric: tabular-nums; }
.numeri span { display: block; font-size: 10px; line-height: 1.2; color: var(--grigio); }
.zona { position: relative; flex: 1; min-height: 0; }
#mappa { position: absolute; inset: 0; background: #e8ecef; }
.legenda {
  position: absolute; left: 10px; bottom: 22px; z-index: 500;
  display: grid; gap: 3px;
  background: rgba(255, 255, 255, .94);
  border-radius: 8px; padding: 6px 8px;
  font-size: 11px; box-shadow: 0 1px 4px rgba(0, 0, 0, .18);
}
.legenda i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -2px; border: 1.5px solid; border-radius: 3px; }
.avviso {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 600;
  width: max-content; max-width: calc(100% - 32px);
  background: #fff8e1; border: 1px solid #e6c65c; border-radius: 8px;
  padding: 7px 11px; font-size: 13px; box-shadow: 0 1px 4px rgba(0, 0, 0, .15);
}
.azioni {
  background: var(--carta);
  border-top: 1px solid var(--linea);
  display: flex; gap: 8px;
  padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px));
}
.azioni a, .azioni button {
  flex: 1; text-align: center; text-decoration: none; cursor: pointer;
  font: 600 13px/1 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color: var(--blu); background: var(--fondo);
  border: 1px solid var(--linea); border-radius: 10px; padding: 12px 6px;
}
.azioni a:focus-visible, .azioni button:focus-visible { outline: 2px solid var(--blu); outline-offset: 2px; }
.leaflet-tooltip.etichetta {
  background: rgba(255, 255, 255, .92); border: 1px solid rgba(28, 39, 51, .35); border-radius: 10px;
  padding: 1px 6px; box-shadow: none;
  font: 700 11px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--inchiostro);
}
.leaflet-tooltip.etichetta::before { display: none; }
.leaflet-popup-content { margin: 12px 14px; font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
.scheda h2 { margin: 0 0 3px; font-size: 15px; color: var(--blu); }
.scheda .stato { margin-bottom: 6px; font-size: 12px; font-weight: 600; }
.scheda table { border-collapse: collapse; margin-bottom: 8px; }
.scheda td { padding: 1px 12px 1px 0; }
.scheda td + td { font-weight: 700; font-variant-numeric: tabular-nums; }
.scheda a { font-weight: 600; }
</style>

const STILI = {
  finito: { color: "#1d6b43", weight: 2, fillColor: "#2e9e64", fillOpacity: 0.45, dashArray: null },
  corso: { color: "#9a6a00", weight: 2, fillColor: "#f0b429", fillOpacity: 0.45, dashArray: null },
  fare: { color: "#3d4b5c", weight: 1.5, fillColor: "#8a97a6", fillOpacity: 0.12, dashArray: "5 4" }
};
const NOMI_STATO = {
  finito: "✅ Finito · Terminat · Done",
  corso: "🟡 In corso · În lucru · In progress",
  fare: "⚪ Da fare · De făcut · To do"
};
const dati = {};
const strati = {};

const mappa = L.map("mappa", { zoomControl: false });
L.control.zoom({ position: "topright" }).addTo(mappa);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(mappa);

function scheda(p) {
  const d = dati[p.code] || { stato: "fare" };
  const riga = (etichetta, valore) => `<tr><td>${etichetta}</td><td>${valore === "" || valore == null ? "·" : valore}</td></tr>`;
  return `<div class="scheda"><h2>${p.code} · ${p.name}</h2>` +
    `<div class="stato">${NOMI_STATO[d.stato]}</div>` +
    `<table>${riga("Nominativi", d.nom)}${riga("Visite", d.vis)}${riga("Studi", d.stu)}${riga("Ultima uscita", d.ultima)}</table>` +
    `<a href="${p.th}" target="_blank" rel="noopener">Apri in TerritoryHelper</a></div>`;
}

const confini = L.geoJSON(TERRITORI, {
  style: () => STILI.fare,
  onEachFeature: (f, strato) => {
    strati[f.properties.code] = strato;
    strato.bindTooltip(String(parseInt(f.properties.code.slice(3), 10)), {
      permanent: true, direction: "center", className: "etichetta"
    });
    strato.bindPopup(() => scheda(f.properties));
  }
}).addTo(mappa);
mappa.fitBounds(confini.getBounds(), { padding: [10, 10] });

let timerAvviso = null;
function mostraAvviso(testo, durata) {
  const box = document.getElementById("avviso");
  box.textContent = testo;
  box.hidden = false;
  clearTimeout(timerAvviso);
  if (durata) timerAvviso = setTimeout(() => { box.hidden = true; }, durata);
}

function statoDa(testo) {
  if (testo.includes("✅")) return "finito";
  if (testo.includes("🟡")) return "corso";
  return "fare";
}

async function carica() {
  try {
    const risposta = await fetch(CSV_URL, { cache: "no-store" });
    if (!risposta.ok) throw new Error("HTTP " + risposta.status);
    const righe = Papa.parse(await risposta.text()).data;
    let finiti = 0, nom = 0, vis = 0, stu = 0;
    for (const r of righe) {
      const codice = (r[0] || "").trim();
      if (!/^TR-\d{2}$/.test(codice)) continue;
      const d = { stato: statoDa(r[1] || ""), nom: (r[2] || "").trim(), vis: (r[3] || "").trim(), stu: (r[4] || "").trim(), ultima: (r[5] || "").trim() };
      dati[codice] = d;
      if (d.stato === "finito") finiti++;
      nom += Number(d.nom) || 0;
      vis += Number(d.vis) || 0;
      stu += Number(d.stu) || 0;
    }
    for (const [codice, strato] of Object.entries(strati)) {
      strato.setStyle(STILI[(dati[codice] || {}).stato || "fare"]);
    }
    document.getElementById("k-finiti").textContent = `${finiti}/${Object.keys(strati).length}`;
    document.getElementById("k-nom").textContent = nom;
    document.getElementById("k-vis").textContent = vis;
    document.getElementById("k-stu").textContent = stu;
    const iEtichetta = righe.findIndex(r => (r[4] || "").startsWith("Aggiornato"));
    const ultimo = iEtichetta >= 0 && righe[iEtichetta + 1] ? (righe[iEtichetta + 1][4] || "").trim() : "";
    const ora = new Date().toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
    document.getElementById("aggiornato").textContent = ultimo && ultimo !== "·"
      ? `Ultimo rapporto ${ultimo} · controllato alle ${ora}`
      : `Ancora nessun rapporto · controllato alle ${ora}`;
    document.getElementById("avviso").hidden = true;
  } catch (errore) {
    mostraAvviso("Non riesco a leggere il Tabellone adesso: vedi solo i confini. Riprovo fra poco.");
  }
}
carica();
setInterval(carica, 5 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) carica(); });

function dentro(punto, anello) {
  let esito = false;
  for (let i = 0, j = anello.length - 1; i < anello.length; j = i++) {
    const [xi, yi] = anello[i], [xj, yj] = anello[j];
    if ((yi > punto.lat) !== (yj > punto.lat) && punto.lng < (xj - xi) * (punto.lat - yi) / (yj - yi) + xi) esito = !esito;
  }
  return esito;
}
let posizione = null;
document.getElementById("dove").addEventListener("click", () => {
  mostraAvviso("Cerco la tua posizione…");
  mappa.locate({ setView: true, maxZoom: 17, enableHighAccuracy: true });
});
mappa.on("locationfound", e => {
  if (posizione) posizione.remove();
  posizione = L.circleMarker(e.latlng, { radius: 8, color: "#ffffff", weight: 3, fillColor: "#1a73e8", fillOpacity: 1 }).addTo(mappa);
  const qui = TERRITORI.features.find(f => dentro(e.latlng, f.geometry.coordinates[0]));
  mostraAvviso(qui ? `Sei nel territorio ${qui.properties.code}` : "Sei fuori dai territori della campagna", 5000);
});
mappa.on("locationerror", () => {
  mostraAvviso("Posizione non disponibile: consenti a Chrome di usare la posizione e riprova.", 6000);
});
</script>
